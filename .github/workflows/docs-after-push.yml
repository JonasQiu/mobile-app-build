name: Docs after push

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: docs-after-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event.deleted == false && !contains(github.event.head_commit.message, '[docs-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update generated documentation
        run: node scripts/sync-docs.mjs
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}
      - name: Validate all documentation
        run: node scripts/check-docs.mjs
      - name: Commit documentation follow-up
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: sync implementation status [docs-sync]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
