name: native-sdd
version: 14
mobileSpecVersion: __MOBILE_SPEC_VERSION__
description: Native 需求交付流程 - Proposal(PRD 承接+需求范围) -> 行为规格 / 技术方案(含接口契约+端侧实现) -> 开发
artifacts:
  - id: proposal
    generates: proposal.md
    description: Proposal,澄清为什么做、做什么、不做什么
    template: proposal.md
    instruction: >
      承接 PRD 与用户/PM 已确认的需求事实,定义本次 change 为什么做、做什么、不做什么。
      内容结构、允许内容与禁写项以 proposal.md 模板为准;缺少产品决策时保留未决问题,
      不得用实现材料补写需求。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: 在 ready Proposal 的产品边界内按页面直接记录详细需求、无需 RD 单独评审的行为规格
    template: spec.md
    instruction: >
      在 status 为 ready 的 proposal.md 的"做什么/不做什么"边界内,根据 PRD 与用户/PM 确认
      按受影响页面划分行为规格。为每个页面选择稳定的 page-spec-id,生成
      specs/<page-spec-id>/spec.md;修改已有页面行为时沿用
      openspec/specs/<page-spec-id>/ 生成 delta spec。无法归属于单一页面的跨页面规则
      可以生成 specs/shared-<domain>/spec.md,但不得在多个页面 Spec 中重复定义同一规则。
      Specs 不得超出 Proposal 的"做什么/不做什么"边界;详细需求的来源、内容结构和行为边界以 spec.md 模板为准。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Native 技术方案，内含整体方案、接口契约、页面变化、实验埋点、风险监控
    template: design.md
    instruction: >
      基于 proposal、specs 和已确认的实现证据，说明本次 change 如何在端侧落地。
      具体章节、接口契约、上下文记录、内容边界和评审就绪条件以 design.md 模板为准。
    requires:
      - proposal
      - specs
  - id: review
    generates: review.md
    description: Review,检查 proposal/specs/design 的完整性、一致性和 Native 风险项
    template: review.md
    instruction: >
      审查 proposal、specs 和 design 的完整性、一致性、内容越界、Native 风险与未决问题。
      只报告证据并指向应回改的 owning artifact，不重写上游内容。
      检查维度、严重级别和唯一状态行格式以 review.md 模板为准。
    requires:
      - proposal
      - specs
      - design
  - id: tasks
    generates: tasks.md
    description: 开发任务清单,用 checkbox 拆解 apply 实现,并记录 Coding 收口与独立 Verify 计划
    template: tasks.md
    instruction: >
      将已通过 review 的 specs 行为与 design 实现方案拆成可追踪的 apply 任务,
      并记录基于项目上下文的 Coding 收口与独立 Verify 计划。
      任务格式、内容边界和完成标准以 tasks.md 模板为准。
    requires:
      - specs
      - design
      - review
apply:
  requires:
    - proposal
    - specs
    - design
    - review
    - tasks
  tracks: tasks.md
  instruction: |
    按 tasks.md 追踪实现,代码行为必须满足 specs,实现方式必须符合 design。
    coding 阶段的读取、Native 上下文约束、变更处理、任务勾选、代码审查、
    静态检查或 lint 收口与失败恢复由 mobile-spec-coding skill 及目标仓库 AGENTS/docs 负责。
    独立复验与 scenario 覆盖由 mobile-spec-verify skill 负责。
archive:
  instruction: |
    archive 完成后触发 PostArchive hook;具体归档与上下文同步流程由 mobile-spec-archive skill 负责。
workflow:
  stages:
    propose:
      label: proposal
      title: 需求澄清阶段
      requires: []
      artifacts:
        - proposal
        - specs
      gate:
        artifact: proposal
        type: proposal-status
        passValue: ready

    design:
      label: design
      title: 技术方案设计阶段
      requires:
        - propose
      artifacts:
        - design
        - review
      gate:
        artifact: review
        type: review-status
        passValue: pass

    task:
      label: task
      title: 任务拆解阶段
      requires:
        - design
      artifacts:
        - tasks
      gate:
        artifact: tasks
        type: task-format

    coding:
      label: coding
      title: 编码实现阶段
      requires:
        - task
      actions:
        - apply
      gate:
        type: apply

    verify:
      label: verify
      title: 交付验证阶段
      requires:
        - coding
      actions:
        - verify
      gate:
        type: verify

    archive:
      label: archive
      title: 归档阶段
      requires:
        - verify
      actions:
        - archive

  hookConfig:
    onChange:
      agentActions:
        - id: sync-change
          type: skill
          skill: mobile-spec-change
          required: true
          blocking: true
