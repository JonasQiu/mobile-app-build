schema: native-sdd
platform: ios
rules:
  design:
    - 生成 artifact 前，根据 CLAUDE.md、AGENTS.md 中的路由表按任务范围读取 docs/* 对应文件获取完整上下文。
    - design.md 必须明确本次涉及的模块、预计修改文件、只读参考文件、禁止修改范围和上下文读取清单。
  preApply:
    - 开发前按 design.md 复核模块、分支与文件范围，只修改已确认内容。
    - apply 阶段读取工程与模块的 docs、AGENTS.md，不提前改写长期上下文。
  postArchive:
    - 归档后运行 Skill `mobile-spec-sync-context`，将稳定设计信息同步回模块 docs/*。
    - AGENTS.md 只维护上下文路由，具体接口、状态和页面行为写入对应专题文档。
