name: h5-sdd
version: 25
mobileSpecVersion: __MOBILE_SPEC_VERSION__
description: 前端需求交付流程 - Proposal(PRD 承接+需求范围) -> 行为规格 / 前端技术方案(含接口契约) -> 开发
artifacts:
  - id: proposal
    generates: proposal.md
    description: Proposal,澄清为什么做、做什么、不做什么
    template: proposal.md
    instruction: >
      承接 PRD 与用户/PM 已确认的需求事实,定义本次 change 为什么做、做什么、不做什么。
      内容结构、允许内容与禁写项以 proposal.md 模板为准;缺少产品决策时保留未决问题,
      不得用实现材料补写需求。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: 在 ready Proposal 的产品边界内按页面直接记录详细需求、无需 RD 单独评审的行为规格
    template: spec.md
    instruction: >
      在 status 为 ready 的 proposal.md 的"做什么/不做什么"边界内,根据 PRD 与用户/PM 确认
      按受影响页面划分行为规格。为每个页面选择稳定的 page-spec-id,生成
      specs/<page-spec-id>/spec.md;修改已有页面行为时沿用
      openspec/specs/<page-spec-id>/ 生成 delta spec。无法归属于单一页面的跨页面规则
      可以生成 specs/shared-<domain>/spec.md,但不得在多个页面 Spec 中重复定义同一规则。
      Specs 不得超出 Proposal 的"做什么/不做什么"边界;详细需求的来源、内容结构和行为边界以 spec.md 模板为准。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: 前端技术方案,用语义化实现改动关联需求、代码落点、验证与风险,并通过接口说明对齐前后端契约
    template: design.md
    instruction: >
      基于 proposal、specs 和已确认的实现证据,说明本次 change 如何落地。
      整体方案先说明端到端落地并包含实现流程图,按语义标题组织实现改动并覆盖页面和 shared Specs,
      非显然技术决策按模板条件展开;内容结构和边界以 design.md 模板为准。
    requires:
      - proposal
      - specs
  - id: review
    generates: review.md
    description: 五维一致性检查，确认 specs 和 design 与 proposal 对齐后才能进入 tasks
    template: review.md
    instruction: >
      审查 proposal、specs 和 design 的完整性、一致性、内容越界与未决问题。
      只报告证据并指向应回改的 owning artifact,不重写上游内容。
      检查维度、严重级别和唯一状态行格式以 review.md 模板为准。
    requires:
      - proposal
      - specs
      - design
  - id: tasks
    generates: tasks.md
    description: 开发任务清单,用 checkbox 拆解 apply,并记录 Coding 收口命令与独立验证计划
    template: tasks.md
    instruction: >
      将已通过 review 的 specs 行为与 design 实现方案拆成可追踪任务。
      任务格式、内容边界和完成标准以 tasks.md 模板为准。
    requires:
      - specs
      - design
      - review
apply:
  requires:
    - proposal
    - specs
    - design
    - review
    - tasks
  tracks: tasks.md
  instruction: |
    按 tasks.md 追踪实现,代码行为必须满足 specs,实现方式必须符合 design。
    checkbox 与 Coding 收口的内容边界以 tasks.md 模板为准;实现、代码审查与修复、
    开发 Server 启动、lint、任务勾选和失败处理由 mobile-spec-coding skill 负责。
    独立复审和复验由 mobile-spec-verify skill 负责。
workflow:
  stages:
    propose:
      label: proposal
      title: 需求澄清阶段
      requires: []
      artifacts:
        - proposal
        - specs
      gate:
        artifact: proposal
        type: proposal-status
        passValue: ready

    design:
      label: design
      title: 技术方案设计阶段
      requires:
        - propose
      artifacts:
        - design
        - review
      gate:
        artifact: review
        type: review-status
        passValue: pass

    task:
      label: task
      title: 任务拆解阶段
      requires:
        - design
      artifacts:
        - tasks
      gate:
        artifact: tasks
        type: task-format

    coding:
      label: coding
      title: 编码实现阶段
      requires:
        - task
      actions:
        - apply
      gate:
        type: apply

    verify:
      label: verify
      title: 交付验证阶段
      requires:
        - coding
      actions:
        - verify
      gate:
        type: verify

    archive:
      label: archive
      title: 归档阶段
      requires:
        - verify
      actions:
        - archive

  hookConfig:
    onChange:
      agentActions:
        - id: sync-change
          type: skill
          skill: mobile-spec-change
          required: true
          blocking: true
